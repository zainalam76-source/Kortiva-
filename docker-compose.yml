version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kortiva
      POSTGRES_PASSWORD: kortiva
      POSTGRES_DB: kortiva
    ports:
      - "5432:5432"
    volumes:
      - kortiva_pgdata:/var/lib/postgresql/data

volumes:
  kortiva_pgdata:
